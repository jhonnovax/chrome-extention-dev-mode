<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Mode</title>
  <style>
    :root {
      --bg: #fff;
      --bg-hover: #f5f5f5;
      --bg-active: #e8e8e8;
      --text: #202124;
      --text-secondary: #5f6368;
      --border: #dadce0;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #292a2d;
        --bg-hover: #3c3d40;
        --bg-active: #4a4b4e;
        --text: #e8eaed;
        --text-secondary: #9aa0a6;
        --border: #5f6368;
        --shadow: rgba(0, 0, 0, 0.3);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-width: 200px;
      background: var(--bg);
      padding: 6px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      border: none;
      background: transparent;
    }

    .menu-item:hover {
      background: var(--bg-hover);
    }

    .menu-item:active {
      background: var(--bg-active);
    }

    .menu-item.active {
      background: var(--bg-hover);
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .menu-item.dev .indicator { background: #00C853; }
    .menu-item.preview .indicator { background: #EAB308; }
    .menu-item.off .indicator { background: #9e9e9e; }

    .menu-item.dev.active .indicator { box-shadow: 0 0 6px #00C853; }
    .menu-item.preview.active .indicator { box-shadow: 0 0 6px #EAB308; }
    .menu-item.off.active .indicator { box-shadow: 0 0 6px #9e9e9e; }

    .menu-item:not(.active) .indicator {
      opacity: 0.4;
    }

    .label {
      flex: 1;
      font-size: 13px;
      font-weight: 400;
      color: var(--text);
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
    }

    .menu-item.dev .badge {
      background: rgba(0, 200, 83, 0.15);
      color: #00a344;
    }

    .menu-item.preview .badge {
      background: rgba(234, 179, 8, 0.18);
      color: #a16207;
    }

    .menu-item.off .badge {
      background: rgba(158, 158, 158, 0.15);
      color: var(--text-secondary);
    }

    @media (prefers-color-scheme: dark) {
      .menu-item.dev .badge {
        background: rgba(0, 200, 83, 0.2);
        color: #69f0ae;
      }

      .menu-item.preview .badge {
        background: rgba(234, 179, 8, 0.24);
        color: #facc15;
      }

      .menu-item.off .badge {
        background: rgba(158, 158, 158, 0.2);
        color: #bdbdbd;
      }
    }

    /* Entry animation */
    .menu-item {
      opacity: 0;
      transform: translateY(-8px);
      animation: slideIn 0.15s ease forwards;
    }

    .menu-item:nth-child(1) { animation-delay: 0s; }
    .menu-item:nth-child(2) { animation-delay: 0.03s; }
    .menu-item:nth-child(3) { animation-delay: 0.06s; }

    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Click ripple effect */
    .menu-item {
      position: relative;
      overflow: hidden;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: var(--shadow);
      transform: scale(0);
      animation: ripple 0.4s ease-out;
      pointer-events: none;
    }

    @keyframes ripple {
      to {
        transform: scale(2.5);
        opacity: 0;
      }
    }

    /* Header with settings button */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px 6px 12px;
    }

    .header .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .settings-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .settings-btn:hover {
      background: var(--bg-hover);
      color: var(--text);
    }

    .settings-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Local server status */
    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .server-status[hidden] { display: none; }

    .server-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
      flex-shrink: 0;
    }

    .server-status.ok .dot { background: #00C853; box-shadow: 0 0 5px #00C853; }
    .server-status.down .dot { background: #D32F2F; box-shadow: 0 0 5px #D32F2F; }
    .server-status.down { color: #c62828; }

    @media (prefers-color-scheme: dark) {
      .server-status.down { color: #ef9a9a; }
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">Dev Mode</span>
    <button class="settings-btn" id="settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </div>
  <div class="menu">
    <div class="menu-item off" data-state="off">
      <span class="indicator"></span>
      <span class="label">Off</span>
      <span class="badge">OFF</span>
    </div>
    <div class="menu-item dev" data-state="dev">
      <span class="indicator"></span>
      <span class="label">Development</span>
      <span class="badge">DEV</span>
    </div>
    <div class="menu-item preview" data-state="preview">
      <span class="indicator"></span>
      <span class="label">Preview</span>
      <span class="badge">PRE</span>
    </div>
  </div>
  <div class="server-status" id="server-status" hidden title="Open settings">
    <span class="dot"></span>
    <span class="text"></span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
